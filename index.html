<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boxy Wallet</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--b1:#FFE4F2;--b2:#E8E1FF;--b3:#D8F1FF;--card:rgba(255,255,255,.78);--ink:#2B2350;--mute:#7A709E;--line:rgba(139,123,255,.22);--p1:#FF7EB6;--p2:#8B7BFF;--mint:#34D3A0;--warn:#F59E0B;--tab:rgba(255,255,255,.88);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#1B1440;--b2:#241A58;--b3:#10234A;--card:rgba(255,255,255,.08);--ink:#F6F1FF;--mute:#B3A9DB;--line:rgba(255,255,255,.14);--tab:rgba(30,22,70,.92)}}
:root[data-theme="dark"]{--b1:#1B1440;--b2:#241A58;--b3:#10234A;--card:rgba(255,255,255,.08);--ink:#F6F1FF;--mute:#B3A9DB;--line:rgba(255,255,255,.14);--tab:rgba(30,22,70,.92)}
*{box-sizing:border-box}
html{background:var(--b2)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;background:linear-gradient(160deg,var(--b1),var(--b2) 50%,var(--b3));background-attachment:fixed;padding-bottom:96px;overflow-x:hidden}
h1,h2,.num,.tag{font-family:"Baloo 2",Nunito,system-ui,sans-serif}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#sky i{position:absolute;font-style:normal;animation:tw 4s ease-in-out infinite;opacity:.7}
@keyframes tw{50%{transform:translateY(-10px) scale(1.25);opacity:.25}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mascot{flex:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:9px 13px;font-weight:700;backdrop-filter:blur(10px);flex:1}
.bubble small{display:block;color:var(--mute);font-weight:600}
.demo{font-size:11px;font-weight:800;color:var(--warn);border:1.5px dashed var(--warn);border-radius:99px;padding:2px 9px;white-space:nowrap}
.glass{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(139,123,255,.12)}
.hero{position:relative;overflow:hidden;color:#fff;border:0;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 14px 34px rgba(139,123,255,.4);border-radius:28px 28px 28px 8px}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:shine 5s ease-in-out infinite}
@keyframes shine{50%,100%{transform:translateX(120%)}}
.hero small{opacity:.9;font-weight:700}
.hero .num{font-size:42px;font-weight:800;line-height:1.1;margin:2px 0 8px;text-shadow:0 2px 10px rgba(0,0,0,.15)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.25);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:800}
.hero .deco{position:absolute;right:14px;top:10px;font-size:26px;animation:tw 3s infinite}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.act{border:0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 4px;color:var(--ink);font:inherit;font-weight:800;font-size:12px;cursor:pointer;backdrop-filter:blur(10px);transition:transform .15s}
.act:active{transform:scale(.92)}
.act span{display:block;font-size:26px;margin-bottom:2px}
h2{font-size:18px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px dashed var(--line)}
.row:first-of-type{border-top:0}
.mute,.row small{color:var(--mute)}
.btn{border:0;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font:inherit;font-weight:800;border-radius:16px;padding:12px 18px;width:100%;cursor:pointer;box-shadow:0 6px 16px rgba(139,123,255,.35);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.sm{width:auto;padding:8px 16px;border-radius:14px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.thumb{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,var(--b1),var(--b3));flex:none}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0}
.item .info{flex:1;min-width:0}
.price{font-weight:800;color:var(--p2)}
label{display:block;font-size:13px;font-weight:800;color:var(--mute);margin-bottom:4px}
input{width:100%;font:inherit;font-weight:700;color:var(--ink);background:rgba(255,255,255,.55);border:1.5px solid var(--line);border-radius:16px;padding:13px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) input{background:rgba(255,255,255,.07)}}
:root[data-theme="dark"] input{background:rgba(255,255,255,.07)}
input:focus-visible,button:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
.flip{display:block;margin:10px auto;border:0;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(139,123,255,.4)}
.steps{display:flex;gap:6px;align-items:center;margin:8px 0;font-size:12px;font-weight:800;color:var(--mute)}
.steps b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--mute);font-size:12px}
.steps b.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.steps u{flex:1;height:3px;border-radius:3px;background:var(--line);text-decoration:none}
.tag{font-size:12px;font-weight:800;border-radius:99px;padding:2px 10px;border:1.5px solid var(--line)}
.tag.funded{color:var(--warn);border-color:var(--warn)}
.tag.completed{color:var(--mint);border-color:var(--mint)}
.tag.disputed{color:var(--mute)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;max-width:496px;margin:0 auto;background:var(--tab);border:1px solid var(--line);border-radius:26px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(139,123,255,.25)}
nav button{border:0;background:none;color:var(--mute);font:inherit;font-weight:800;font-size:12px;padding:7px 0;border-radius:20px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2))}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(10px);z-index:9;background:var(--ink);color:var(--b1);padding:10px 18px;border-radius:99px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.pop{position:fixed;z-index:9;pointer-events:none;font-size:22px;animation:pop 1s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(.5);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<main>
  <div class="top">
    <svg class="mascot" viewBox="0 0 120 110" width="84" height="78" aria-hidden="true">
      <path d="M24 40L28 8L54 30Z" fill="#fff" stroke="#2B2350" stroke-width="3" stroke-linejoin="round"/>
      <path d="M96 40L92 8L66 30Z" fill="#fff" stroke="#2B2350" stroke-width="3" stroke-linejoin="round"/>
      <path d="M31 28L33 17L43 26Z" fill="#FFB7D5"/><path d="M89 28L87 17L77 26Z" fill="#FFB7D5"/>
      <rect x="12" y="30" width="96" height="70" rx="22" fill="#fff" stroke="#2B2350" stroke-width="3"/>
      <rect x="52" y="30" width="16" height="16" fill="#CDBEFF"/>
      <ellipse cx="40" cy="66" rx="6.5" ry="8.5" fill="#2B2350"/><circle cx="42.5" cy="62" r="2.6" fill="#fff"/>
      <ellipse cx="80" cy="66" rx="6.5" ry="8.5" fill="#2B2350"/><circle cx="82.5" cy="62" r="2.6" fill="#fff"/>
      <ellipse cx="27" cy="78" rx="8" ry="5" fill="#FFB7D5" opacity=".85"/><ellipse cx="93" cy="78" rx="8" ry="5" fill="#FFB7D5" opacity=".85"/>
      <path d="M54 77Q60 85 66 77" stroke="#2B2350" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="bubble">Hi, friend! Welcome to Boxy ✨<small>Your cozy little wallet</small></div>
    <span class="demo">Demo coins</span>
  </div>
  <div id="view"></div>
</main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<script>
var S={bxy:1000,usdt:0,dir:0,tab:"wallet",daily:false,
 items:[{id:1,t:"Cute logo design",p:300,e:"🎨",by:"Mika"},{id:2,t:"Channel promo post",p:150,e:"📣",by:"Ren"},{id:3,t:"Sticker & template pack",p:500,e:"🧩",by:"Sora"},{id:4,t:"1 hour tutoring",p:200,e:"📚",by:"Aoi"}],
 deals:[],log:["🎁 Welcome gift: 1,000 BXY"]},RATE=100;
var TABS=[["wallet","💖","Wallet"],["swap","🔁","Swap"],["market","🛍️","Market"],["deals","🤝","Deals"]];
function f(n){return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
(function(){var s=document.getElementById("sky"),e=["✨","⭐","💫","🌸","☁️"];for(var i=0;i<14;i++){var d=document.createElement("i");d.textContent=e[i%5];d.style.left=(Math.random()*96)+"%";d.style.top=(Math.random()*92)+"%";d.style.fontSize=(10+Math.random()*14)+"px";d.style.animationDelay=(Math.random()*4)+"s";s.appendChild(d)}})();
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="show";clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=""},2300)}
function burst(){var e=["💖","✨","⭐","🌸","💫","🎀"];for(var i=0;i<9;i++){var p=document.createElement("span");p.className="pop";p.textContent=e[i%6];p.style.left="50%";p.style.top="45%";p.style.setProperty("--x",(Math.random()*240-120)+"px");p.style.setProperty("--y",(Math.random()*-220-20)+"px");document.body.appendChild(p);setTimeout(function(x){return function(){x.remove()}}(p),1000)}}
function go(t){S.tab=t;draw()}
function draw(){
 document.getElementById("nav").innerHTML=TABS.map(function(x){return '<button class="'+(S.tab===x[0]?"on":"")+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join("");
 var h="";
 if(S.tab==="wallet"){
  h='<div class="glass hero"><span class="deco">✨</span><small>Total balance</small><div class="num">'+f(S.bxy)+' BXY</div><div class="chips"><span class="chip">💵 '+f(S.usdt)+' USDT</span><span class="chip">Demo value only</span></div></div>'+
  '<div class="acts"><button class="act" onclick="toast(\'Sending works inside the bot chat 💌\')"><span>💌</span>Send</button><button class="act" onclick="go(\'swap\')"><span>🔁</span>Swap</button><button class="act" onclick="go(\'market\')"><span>🛍️</span>Shop</button><button class="act" onclick="daily()"><span>🎁</span>'+(S.daily?"Claimed":"Daily")+'</button></div>'+
  '<div class="glass"><h2>Recent activity ✨</h2>'+S.log.slice(0,6).map(function(l){return '<div class="row"><span>'+l+'</span></div>'}).join("")+'</div>';
 }
 if(S.tab==="swap"){
  var a=S.dir===0?"BXY":"USDT",b=S.dir===0?"USDT":"BXY";
  h='<div class="glass"><h2>Swap 🔁</h2><label for="amt">You pay ('+a+')</label><input id="amt" type="number" inputmode="decimal" min="0" placeholder="0.00" oninput="est()">'+
  '<button class="flip" aria-label="Switch direction" onclick="S.dir=1-S.dir;draw()">⇅</button>'+
  '<label>You get ('+b+')</label><input id="get" disabled placeholder="0.00"><p class="mute">Rate: 1 USDT = '+RATE+' BXY 🌸</p>'+
  '<button class="btn" onclick="swap()">Swap '+a+' to '+b+' ✨</button></div>'+
  '<div class="glass"><div class="row"><span>🪙 BXY</span><b>'+f(S.bxy)+'</b></div><div class="row"><span>💵 USDT</span><b>'+f(S.usdt)+'</b></div></div>';
 }
 if(S.tab==="market"){
  h='<div class="glass"><h2>Cozy Market 🛍️</h2>'+(S.items.length?S.items.map(function(i){return '<div class="item"><div class="thumb">'+i.e+'</div><div class="info"><b>'+i.t+'</b><br><small class="mute">by '+i.by+' · escrow protected</small></div><div style="text-align:right"><div class="price">'+f(i.p)+'</div><button class="btn sm" onclick="buy('+i.id+')">Buy</button></div></div>'}).join(""):'<p class="mute">All sold out! New treasures arrive soon 🌸</p>')+'</div>';
 }
 if(S.tab==="deals"){
  h='<div class="glass"><h2>My Deals 🤝</h2>'+(S.deals.length?S.deals.map(function(d){
   var done=d.st==="completed",act=d.st==="funded"?'<div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm" onclick="rel('+d.id+')">Release 💖</button><button class="btn sm ghost" onclick="dis('+d.id+')">Dispute</button></div>':"";
   return '<div class="item" style="align-items:flex-start"><div class="thumb">'+d.e+'</div><div class="info"><b>'+d.t+'</b><br><small class="mute">'+f(d.p)+' BXY</small><div class="steps"><b class="on">1</b><u></u><b class="'+(done?"on":"")+'">2</b><u></u><b class="'+(done?"on":"")+'">3</b></div><small class="mute">Paid · Received · Released</small>'+act+'</div><span class="tag '+d.st+'">'+d.st+'</span></div>'}).join(""):'<p class="mute">No deals yet. Find something lovely in Market 💫</p>')+'</div>';
 }
 document.getElementById("view").innerHTML=h;
}
function est(){var x=parseFloat(document.getElementById("amt").value)||0;document.getElementById("get").value=x?f(S.dir===0?x/RATE:x*RATE):""}
function daily(){if(S.daily){toast("Come back tomorrow for more 🌙");return}S.daily=true;S.bxy+=100;S.log.unshift("🎁 Daily gift: +100 BXY");burst();toast("+100 BXY! Yay 💖");draw()}
function swap(){
 var x=parseFloat(document.getElementById("amt").value);
 if(!(x>0)){toast("Enter an amount first 🌸");return}
 if(S.dir===0){if(x>S.bxy){toast("Not enough BXY 🥺");return}S.bxy-=x;S.usdt+=x/RATE;S.log.unshift("🔁 Swapped "+f(x)+" BXY to USDT")}
 else{if(x>S.usdt){toast("Not enough USDT 🥺");return}S.usdt-=x;S.bxy+=x*RATE;S.log.unshift("🔁 Swapped "+f(x)+" USDT to BXY")}
 burst();toast("Swap complete ✨");draw();
}
function buy(id){
 var i=S.items.filter(function(z){return z.id===id})[0];
 if(!i)return;
 if(S.bxy<i.p){toast("Not enough BXY 🥺");return}
 S.bxy-=i.p;S.items=S.items.filter(function(z){return z.id!==id});
 S.deals.unshift({id:i.id,t:i.t,p:i.p,e:i.e,st:"funded"});S.log.unshift("🛍️ Escrow: paid "+f(i.p)+" BXY for "+i.t);
 burst();toast("Deal created! Funds are safe in escrow 🔒");go("deals");
}
function setSt(id,st,msg){S.deals.forEach(function(d){if(d.id===id)d.st=st});if(st==="completed")burst();toast(msg);draw()}
function rel(id){setSt(id,"completed","Funds released. Thank you! 💖")}
function dis(id){setSt(id,"disputed","Dispute opened. An admin will help 🌙")}
draw();
</script>
</body>
</html>
